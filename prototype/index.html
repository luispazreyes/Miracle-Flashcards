<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miracle Flashcards</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="/icono-192.png" type="image/png" />
    <script>
      // RF-42: aplicar el tema antes del primer pintado (evita parpadeo).
      (function () {
        var tema = null;
        try { tema = localStorage.getItem('mf-tema'); } catch (e) {}
        if (tema !== 'azul' && tema !== 'blanco' && tema !== 'oscuro') {
          tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'blanco';
        }
        document.documentElement.dataset.tema = tema;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
